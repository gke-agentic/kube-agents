name: "RC: Release Pipeline"

permissions:
  contents: read

# NO `schedule:` — rc-scheduler.yml owns the cron and dispatches this workflow
# only when there is a new candidate to test. That is what makes a run of this
# pipeline mean something: it no longer has a quiet-tick path that concludes
# success having done nothing, so its last conclusion is the last real result.
# rc-scheduler.yml's header has the full argument. Putting the cron back here
# reintroduces the skip-paints-over-a-failure problem.
on:
  #checkov:skip=CKV_GHA_7:Manual release candidate pipeline requires target commit sha and tag inputs
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Target Commit SHA for Release Candidate (Mandatory)"
        required: true
        type: string
      rc_tag:
        description: "Release Candidate Tag Name (Optional, auto-generated if omitted)"
        required: false
        type: string

concurrency:
  group: rc-release-pipeline
  cancel-in-progress: false

jobs:
  step-1-create-tag:
    name: Step 1 - Create Release Candidate Tag
    # The cron now sits on rc-scheduler.yml, so a fork no longer inherits a
    # trigger that fires here on its own — but the guard stays on every job.
    # A fork can still dispatch this by hand with none of the release
    # credentials, and the guard is what a re-added `schedule:` would need. It
    # repeats per job rather than relying on the skip cascading through `needs`:
    # an `always()` added to a later job would silently un-guard the pipeline.
    if: github.repository == 'gke-labs/kube-agents'
    uses: ./.github/workflows/rc-create-tag.yml
    permissions:
      contents: write
    with:
      commit_sha: ${{ inputs.commit_sha }}
      rc_tag: ${{ inputs.rc_tag }}
      # Always false now that rc-scheduler.yml owns the cron: this workflow is
      # only ever dispatched, and always with a commit_sha the scheduler already
      # resolved. Kept wired rather than hardcoded so that re-adding a
      # `schedule:` here restores the self-resolving path in one edit instead of
      # silently running with is_scheduled false, which is the branch of
      # resolve_rc_tag.sh that errors on a missing commit.
      #
      # The consequence, stated so the `skip_rc` guards below are not read as
      # live: the skip decision has moved to the scheduler, so a dispatched run
      # never sets skip_rc. The guards stay because they are still correct, and
      # because they are what a re-added cron would need.
      is_scheduled: ${{ github.event_name == 'schedule' }}
    secrets:
      RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}

  step-2-deploy-env:
    name: Step 2 - Provision RC Environment
    needs: step-1-create-tag
    if: |
      github.repository == 'gke-labs/kube-agents' &&
      needs.step-1-create-tag.outputs.skip_rc != 'true'
    # inherit, not an explicit mapping — the same reason
    # staging-redeploy-integrations.yml already records. The called
    # deploy-environment job reads GH_APP_ID and GH_APP_PRIVATE_KEY, which are
    # `rc` ENVIRONMENT secrets, and a `uses:` job cannot declare an
    # environment, so any `secrets:` mapping written here resolves
    # against nothing and forwards
    # empties. Observed, not assumed: with the mapping in place, that job
    # logged GITHUB_APP_ID as empty on a run five hours after the secret was
    # created on the rc environment.
    #
    # scripts/release/README.md, "Enabling the GitHub token minter on the RC",
    # is the single home for what the wiring requires and why; this comment is
    # here because the mistake is made at this line.
    uses: ./.github/workflows/deploy-environment.yml # zizmor: ignore[secrets-inherit]
    permissions:
      contents: read
      id-token: write
    with:
      github_environment: "rc"
      rc_tag: ${{ needs.step-1-create-tag.outputs.rc_tag }}
    secrets: inherit

  step-3-run-e2e-tests:
    name: Step 3 - Run E2E Tests
    needs: [step-1-create-tag, step-2-deploy-env]
    if: |
      github.repository == 'gke-labs/kube-agents' &&
      needs.step-1-create-tag.outputs.skip_rc != 'true'
    # `inherit` for the reason step 2 records above and for nothing more: the
    # called job renders `environment:` from the github_environment passed
    # below, and the E2E_CHAT_* secrets it reads live on `rc`. A `uses:` job
    # cannot declare an environment, so an explicit mapping written here would
    # resolve at repository scope and forward empties to the mandatory Chat
    # gate.
    uses: ./.github/workflows/e2e-run.yml # zizmor: ignore[secrets-inherit]
    permissions:
      contents: read
      id-token: write
    with:
      github_environment: "rc"
      commit_sha: ${{ needs.step-1-create-tag.outputs.commit_sha }}
      # The Chat gate blocks the candidate; the cluster and fleet-audit suite is
      # coverage that must not. Same split as before this job became a call.
      # The scenario and stream filters moved into the `rc` suite's `env_vars`
      # in e2e_config.yaml, where they were already declared.
      blocking_suite: "gchat"
      optional_suites: "rc"
    secrets: inherit

  step-4-tag-validated:
    name: Step 4 - Tag Validated Release
    needs: [step-1-create-tag, step-3-run-e2e-tests]
    if: |
      github.repository == 'gke-labs/kube-agents' &&
      needs.step-1-create-tag.outputs.skip_rc != 'true'
    uses: ./.github/workflows/rc-tag-validated.yml
    permissions:
      contents: write
    with:
      rc_tag: ${{ needs.step-1-create-tag.outputs.rc_tag }}
    secrets:
      RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}

  step-5-teardown-env:
    name: Step 5 - Tear Down RC Environment
    # Every earlier job, so that the implicit success() on `needs` is what gates
    # this one: the RC cluster is destroyed only when the whole run passed. A
    # failure anywhere leaves the environment standing to be examined live —
    # which is the point, since the E2E failures worth diagnosing are the ones
    # that only reproduce on the cluster that produced them. Nothing else
    # removes it; the next run's pre-install teardown does, up to three hours
    # later, so a failure that needs longer than that wants the schedule paused.
    #
    # The `if:` below does NOT weaken that gate. It adds conditions rather than
    # replacing the success() check, the way step 4 already skips when step 3
    # fails despite carrying an `if:` of its own. An `always()` added here would
    # remove it and start destroying the environments this exists to preserve.
    needs:
      [
        step-1-create-tag,
        step-2-deploy-env,
        step-3-run-e2e-tests,
        step-4-tag-validated,
      ]
    if: |
      github.repository == 'gke-labs/kube-agents' &&
      needs.step-1-create-tag.outputs.skip_rc != 'true'
    uses: ./.github/workflows/teardown-environment.yml
    permissions:
      contents: read
      id-token: write
    with:
      github_environment: "rc"
      rc_tag: ${{ needs.step-1-create-tag.outputs.rc_tag }}
