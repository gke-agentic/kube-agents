name: Validate Repo Structure

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# A re-push supersedes this pull request's earlier run instead of stacking a
# second full set of checks behind it. Runs that are not from a pull request
# fall back to github.run_id, which is unique, so each sits alone in its own
# group and none is ever cancelled. A shared key would not be safe there:
# GitHub holds only one run pending per group, so a burst of merges to main
# would lose the runs in the middle before they started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A job of its own rather than a step in `validate` below, for two reasons.
  # It needs none of that job's setup -- no Helm, no Terraform, no pip, just the
  # preinstalled python3 -- so it reports in seconds instead of waiting behind
  # them. And a step would be masked: a broken `terraform fmt` means these
  # findings never print, the author fixes Terraform, pushes, and only then
  # discovers the prompt errors. A separate job gets its own status line and
  # cannot be hidden by a failure it has nothing to do with.
  #
  # Deliberately unfiltered. A paths filter is precisely what kept the Python
  # suite from running at all (see python-tests.yml), and a check on prose that
  # only starts when prose changes would miss the rename that broke it -- that
  # rename lands in a directory name.
  prompt-assets:
    name: Agent instructions cite assets that exist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Findings are emitted as GitHub annotations as well as to stderr, so a
      # broken reference lands on the line that holds it in Files Changed. This
      # layer has no human reader at review time; a red check the author has to
      # go digging in a log for is most of the way to no check at all.
      - name: Check prompt assets
        run: make prompt-check

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Structure
        run: make validate

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Check chart CRD/RBAC copies are in sync
        run: make chart-check

      - name: Check the container-image inventory
        run: make images-check

      - name: Validate Helm Chart
        run: |
          # clusterName/location/projectId are required values with no
          # defaults, so lint and render need them set.
          SET_FLAGS=(
            --set platformAgent.harness.clusterName=ci-cluster
            --set platformAgent.harness.location=us-central1
            --set platformAgent.harness.projectId=ci-project
          )
          helm lint charts/kube-agents "${SET_FLAGS[@]}"
          helm template test-release charts/kube-agents "${SET_FLAGS[@]}" > /dev/null
          # Render again with explicit image tags to cover the override path.
          helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            --set operator.image.tag=v9.9.9 \
            --set platformAgent.deployment.image.tag=v9.9.9 > /dev/null
          # Rendering without the required values must fail.
          if helm template test-release charts/kube-agents > /dev/null 2>&1; then
            echo "expected 'required' guards to fail the render" >&2
            exit 1
          fi

          # kube-agents.compactFields keeps `false` and `0` — the whole reason
          # it exists over `with`, and the one thing here no other check covers.
          # A regression drops an explicit `dashboardEnabled: false` from the CR,
          # the CRD default of `true` applies, and the render stays valid YAML:
          # lint passes, and the dashboard comes up on an install that asked for it
          # off.
          # --show-only isolates the CR: `memory:` also appears in every
          # resources block, and matching one of those would make this pass for
          # the wrong reason.
          rendered=$(helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            --show-only templates/platform-agent-cr.yaml \
            --set platformAgent.harness.hermes.dashboardEnabled=false \
            --set platformAgent.harness.memory.enabled=false \
            --set platformAgent.deployment.availability.replicas=0)
          for expected in "dashboardEnabled: false" "memoryEnabled: false" "replicas: 0"; do
            if ! grep -qF "$expected" <<<"$rendered"; then
              echo "compactFields dropped '$expected' from the rendered CR" >&2
              exit 1
            fi
          done

          # ...and the parent key disappears when every child is unset, which is
          # what lets callers write `{{- with (include ...) }}`. hermes is not in
          # this list: it carries a mandatory apiServerSecretRef and so always
          # renders — only the optional fields inside it are compacted.
          if helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            --show-only templates/platform-agent-cr.yaml \
            | grep -qE "^\s+(memory|availability):"; then
            echo "an all-unset parent block still rendered" >&2
            exit 1
          fi

          # Webhooks: off by default, fully wired when on.
          if helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            | grep -qE "WebhookConfiguration|kind: Certificate"; then
            echo "webhook objects rendered while operator.webhooks.enabled=false" >&2
            exit 1
          fi
          webhooks=$(helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            --set operator.webhooks.enabled=true)
          for expected in \
            "kind: MutatingWebhookConfiguration" \
            "kind: ValidatingWebhookConfiguration" \
            "kind: Certificate" \
            "kind: Issuer" \
            "cert-manager.io/inject-ca-from:" \
            "containerPort: 10250" \
            "/tmp/k8s-webhook-server/serving-certs"; do
            if ! grep -qF "$expected" <<<"$webhooks"; then
              echo "webhook render is missing '$expected'" >&2
              exit 1
            fi
          done
          if ! grep -qF 'value: "true"' <<<"$(grep -A1 ENABLE_WEBHOOKS <<<"$webhooks")"; then
            echo "ENABLE_WEBHOOKS did not follow operator.webhooks.enabled" >&2
            exit 1
          fi

          # failurePolicy=Fail on a fresh install that also creates the CR
          # deadlocks (Helm registers the webhooks before the operator holds a
          # certificate), so the chart must refuse to render it.
          if helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            --set operator.webhooks.enabled=true \
            --set operator.webhooks.failurePolicy=Fail > /dev/null 2>&1; then
            echo "expected the fresh-install failurePolicy=Fail guard to fire" >&2
            exit 1
          fi
          # The same combination is fine without the CR, and on an upgrade.
          helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            --set operator.webhooks.enabled=true \
            --set operator.webhooks.failurePolicy=Fail \
            --set platformAgent.enabled=false > /dev/null
          helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            --set operator.webhooks.enabled=true \
            --set operator.webhooks.failurePolicy=Fail --is-upgrade > /dev/null

          # The pre-delete cleanup hook: on by default, gone when disabled, and
          # carrying the `|| true` that keeps a wait timeout from failing the
          # hook and aborting the uninstall — the hook's whole contract.
          hook=$(helm template test-release charts/kube-agents "${SET_FLAGS[@]}")
          for expected in \
            "helm.sh/hook: pre-delete" \
            "|| true"; do
            if ! grep -qF "$expected" <<<"$hook"; then
              echo "cleanup hook render is missing '$expected'" >&2
              exit 1
            fi
          done
          if helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            --set platformAgent.cleanupHook.enabled=false \
            | grep -qF "helm.sh/hook: pre-delete"; then
            echo "cleanup hook rendered while platformAgent.cleanupHook.enabled=false" >&2
            exit 1
          fi

          # The Hindsight memory store: absent by default, rendered complete
          # when the memory provider needs it (the null-follows-provider
          # tri-state), and forced off by an explicit enabled=false even with
          # a hindsight provider selected.
          if helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            | grep -qF "hindsight"; then
            echo "hindsight rendered in the default install" >&2
            exit 1
          fi
          hindsight=$(helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            --set platformAgent.harness.memory.provider=kube_agents_memory \
            --show-only templates/hindsight.yaml)
          for expected in \
            "kind: Deployment" \
            "kind: StatefulSet" \
            "kind: NetworkPolicy" \
            "kind: PodMonitoring" \
            "name: hindsight-api" \
            "name: hindsight-postgresql"; do
            if ! grep -qF "$expected" <<<"$hindsight"; then
              echo "hindsight render is missing '$expected' with a hindsight memory provider" >&2
              exit 1
            fi
          done
          if helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            --set platformAgent.harness.memory.provider=hindsight \
            --set hindsight.enabled=false \
            | grep -qF "name: hindsight-api"; then
            echo "hindsight rendered despite hindsight.enabled=false" >&2
            exit 1
          fi

          # The GitHub token minter: absent by default; enabled with an appId
          # it renders all six objects, deriving the regional KMS location
          # from a zonal cluster location; without an appId the
          # github-app-credentials Secret is the one object that must not
          # render (it is expected to pre-exist).
          if helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            | grep -qF "github-token-minter"; then
            echo "github-token-minter rendered in the default install" >&2
            exit 1
          fi
          MINTER_FLAGS=(
            --set githubMinter.enabled=true
            --set githubMinter.org=test-org
            --set githubMinter.repo=test-repo
            --set platformAgent.harness.location=us-central1-a
          )
          minter=$(helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            "${MINTER_FLAGS[@]}" --set githubMinter.appId=12345 \
            --show-only templates/github-minter.yaml)
          for expected in \
            "kind: Secret" \
            "name: github-app-credentials" \
            "kind: ServiceAccount" \
            "kind: ConfigMap" \
            "kind: Deployment" \
            "kind: Service" \
            "kind: NetworkPolicy" \
            "name: github-token-minter" \
            "locations/us-central1/keyRings/github-token-minter-keyring"; do
            if ! grep -qF "$expected" <<<"$minter"; then
              echo "minter render is missing '$expected' with githubMinter enabled" >&2
              exit 1
            fi
          done
          minter_no_app=$(helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            "${MINTER_FLAGS[@]}" --show-only templates/github-minter.yaml)
          # The Deployment still names the Secret (it must pre-exist), so key
          # on the object kind: the file renders exactly one Secret, and only
          # when appId is set.
          if grep -qF "kind: Secret" <<<"$minter_no_app"; then
            echo "github-app-credentials Secret rendered without githubMinter.appId" >&2
            exit 1
          fi
          if ! grep -qF "name: github-token-minter" <<<"$minter_no_app"; then
            echo "minter workload missing when appId is empty (Secret should be the only omission)" >&2
            exit 1
          fi

          # The self-improvement loop: off by default, and its three modes
          # differ in exactly one thing a render can see — whether the token
          # minter is there. Every guard below fails the render rather than
          # producing a broken install, which is the only reason they are
          # testable here at all.
          if helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            | grep -qiF "selfimprove"; then
            echo "the self-improvement loop rendered while it is disabled" >&2
            exit 1
          fi
          SI_FLAGS=(--set selfImprovement.enabled=true)
          si=$(helm template test-release charts/kube-agents "${SET_FLAGS[@]}" "${SI_FLAGS[@]}")
          for expected in \
            "kind: CronJob" \
            "kind: NetworkPolicy" \
            "kind: ServiceAccount" \
            "kind: Role" \
            "name: kubeagents-selfimprove"; do
            if ! grep -qF "$expected" <<<"$si"; then
              echo "report-only render is missing '$expected'" >&2
              exit 1
            fi
          done
          # The default mode has no GitHub identity at all, so the minter, the
          # credential proxy and the App Secret must all be absent. This is the
          # isolation claim the design makes, and the one a stray unguarded
          # block would quietly retract.
          for forbidden in \
            "kube-agents-selfimprove-token-minter" \
            "selfimprove-app-credentials" \
            "CREDENTIAL_PROXY_URL"; do
            if grep -qF "$forbidden" <<<"$si"; then
              echo "'$forbidden' rendered under the default report-only mode" >&2
              exit 1
            fi
          done
          FORK_FLAGS=(
            --set selfImprovement.mode=fork
            --set selfImprovement.github.appId=12345
            --set selfImprovement.github.forkRepo=test-org/kube-agents
          )
          fork=$(helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            "${SI_FLAGS[@]}" "${FORK_FLAGS[@]}")
          for expected in \
            "kube-agents-selfimprove-token-minter" \
            "CREDENTIAL_PROXY_URL"; do
            if ! grep -qF "$expected" <<<"$fork"; then
              echo "fork render is missing '$expected'" >&2
              exit 1
            fi
          done
          # Where the pull request is opened is the one value that differs
          # between the two filing modes, and getting it wrong sends the turn at
          # a repository the minter issued no rule for — an hour into a run, on
          # the loop's only write.
          if ! grep -A1 SELFIMPROVE_UPSTREAM_REPO <<<"$fork" \
            | grep -qF "test-org/kube-agents"; then
            echo "fork mode did not target the fork" >&2
            exit 1
          fi
          upstream=$(helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            "${SI_FLAGS[@]}" "${FORK_FLAGS[@]}" --set selfImprovement.mode=upstream)
          if ! grep -A1 SELFIMPROVE_UPSTREAM_REPO <<<"$upstream" \
            | grep -qF "gke-labs/kube-agents"; then
            echo "upstream mode did not target the upstream" >&2
            exit 1
          fi
          # The minty rules are the loop's only write grant, and in upstream
          # mode the two repositories deliberately get different ones: the fork
          # receives a pushed branch (`contents`), the upstream receives a
          # cross-fork pull request opened from it (`pull_requests`). One
          # permission set for both is the obvious shortcut and it hands an
          # autonomous loop push access to gke-labs/kube-agents — the one thing
          # repository policy says never to do. Neither rule may carry
          # `issues`; §12 of the design turns on that scope not being taken.
          # `rule` prints one config key's block, so a permission granted on
          # the wrong repository cannot pass by appearing somewhere in the file.
          rule() {
            awk -v key="$1" '
              $0 == "  " key ": |" { inblock = 1; next }
              inblock && /^[^ ]/ { inblock = 0 }
              inblock && /^  [^ ]/ { inblock = 0 }
              inblock { print }
            '
          }
          minter=$(helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            "${SI_FLAGS[@]}" "${FORK_FLAGS[@]}" --set selfImprovement.mode=upstream \
            --show-only templates/self-improvement-minter.yaml)
          up_rule=$(rule gke-labs-kube-agents.yaml <<<"$minter")
          fork_rule=$(rule test-org-kube-agents.yaml <<<"$minter")
          # `expected` is yes/no so the absences are asserted as loudly as the
          # presences: the failure this guards against is a permission that
          # appears, not one that goes missing.
          for check in \
            'up_rule:pull_requests: "write":yes' \
            'up_rule:contents: "write":no' \
            'fork_rule:contents: "write":yes' \
            'fork_rule:pull_requests: "write":no'; do
            var=${check%%:*}; rest=${check#*:}
            needle=${rest%:*}; want=${rest##*:}
            if grep -qF "$needle" <<<"${!var}"; then found=yes; else found=no; fi
            if [ "$found" != "$want" ]; then
              echo "upstream minty rule $var: '$needle' expected=$want got=$found" >&2
              exit 1
            fi
          done
          if grep -qF 'issues:' <<<"$minter"; then
            echo "the self-improvement minter granted an issues scope" >&2
            exit 1
          fi
          # Fork mode collapses the two roles into one repository, which is the
          # only configuration where both permissions on one slug is correct.
          fork_minter=$(helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            "${SI_FLAGS[@]}" "${FORK_FLAGS[@]}" \
            --show-only templates/self-improvement-minter.yaml)
          both=$(rule test-org-kube-agents.yaml <<<"$fork_minter")
          for needle in 'contents: "write"' 'pull_requests: "write"'; do
            if ! grep -qF "$needle" <<<"$both"; then
              echo "fork mode's minty rule is missing '$needle'" >&2
              exit 1
            fi
          done
          # gsaName reaches a Workload Identity annotation in every mode, so an
          # unusable id has to fail at render: GCP accepts the annotation, the
          # pod starts, and every telemetry read 403s with nothing naming it.
          # 23 in the filing modes because the minter's account is this plus
          # `-minter`; 30 otherwise, which is GCP's own cap.
          for bad in \
            kubeagents-selfimprove-loop-service-account \
            Kubeagents-Selfimprove \
            kubeagents-selfimprove- \
            four; do
            if helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
              "${SI_FLAGS[@]}" --set "selfImprovement.github.gsaName=$bad" \
              > /dev/null 2>&1; then
              echo "expected the gsaName guard to reject '$bad' in report-only" >&2
              exit 1
            fi
          done
          # Valid at 30 and rejected at 24 once a minter derives from it.
          helm template test-release charts/kube-agents "${SET_FLAGS[@]}" "${SI_FLAGS[@]}" \
            --set selfImprovement.github.gsaName=kubeagents-selfimprove-loop-ab > /dev/null
          if helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            "${SI_FLAGS[@]}" "${FORK_FLAGS[@]}" \
            --set selfImprovement.github.gsaName=kubeagents-selfimprove-x \
            > /dev/null 2>&1; then
            echo "expected the 23-character minter cap to fire in fork mode" >&2
            exit 1
          fi
          # An unknown mode, and upstream mode with one slug for both
          # repositories — which collapses two minty rules into a push grant on
          # gke-labs/kube-agents.
          if helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            "${SI_FLAGS[@]}" --set selfImprovement.mode=advisory > /dev/null 2>&1; then
            echo "expected an unknown selfImprovement.mode to fail the render" >&2
            exit 1
          fi
          if helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            "${SI_FLAGS[@]}" "${FORK_FLAGS[@]}" --set selfImprovement.mode=upstream \
            --set selfImprovement.github.forkRepo=gke-labs/kube-agents \
            > /dev/null 2>&1; then
            echo "expected upstream mode to reject fork == upstream" >&2
            exit 1
          fi
          # The imagePullSecrets loop below only walks templates that render
          # under default values, so it never reaches this CronJob.
          if ! helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            "${SI_FLAGS[@]}" --set global.imagePullSecrets[0]=regcred \
            --show-only templates/self-improvement.yaml | grep -qF 'name: "regcred"'; then
            echo "global.imagePullSecrets did not reach the self-improvement CronJob" >&2
            exit 1
          fi

          # global.imagePullSecrets has to reach every pod the chart renders, and
          # a `with` block omitted from one of them still renders valid YAML —
          # the install then works everywhere except the pod nobody remembered,
          # and on the pre-delete cleanup Job that means a failed uninstall.
          #
          # So derive the list from the render rather than freeze it here: a
          # template added later is checked without anyone remembering to add
          # it, which a hard-coded list is exactly what fails at. --show-only
          # per template so a hit in one cannot cover for a miss in another.
          # Still missed: a template that only renders under non-default values.
          checked=0
          for tpl in charts/kube-agents/templates/*.yaml; do
            rel="templates/$(basename "$tpl")"
            out=$(helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
              --set global.imagePullSecrets[0]=regcred --show-only "$rel" 2>/dev/null) || continue
            grep -qE '^[[:space:]]+containers:' <<<"$out" || continue
            checked=$((checked + 1))
            if ! grep -qF 'name: "regcred"' <<<"$out"; then
              echo "global.imagePullSecrets did not reach the pod spec in $rel" >&2
              exit 1
            fi
          done
          # Three under these values: the operator, LiteLLM, and the cleanup Job.
          # A drop means a template stopped rendering and quietly left the loop.
          if [ "$checked" -lt 3 ]; then
            echo "expected at least 3 pod-rendering templates, checked $checked" >&2
            exit 1
          fi
          # The PlatformAgent CR carries no pod spec of its own, so the loop
          # above skips it — and it is what gives the agent pods the operator
          # renders their pull identity.
          if ! helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            --set global.imagePullSecrets[0]=regcred \
            --show-only templates/platform-agent-cr.yaml | grep -qF 'name: "regcred"'; then
            echo "global.imagePullSecrets did not reach the PlatformAgent CR" >&2
            exit 1
          fi
          # The {name: x} spelling Kubernetes itself uses has to work too:
          # rendered as a value it yields the Secret name "map[name:regcred]",
          # which the API server accepts and the kubelet cannot find.
          if ! helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            --set global.imagePullSecrets[0].name=regcred \
            --show-only templates/platform-agent-cr.yaml | grep -qF 'name: "regcred"'; then
            echo "the {name: x} form of global.imagePullSecrets did not render" >&2
            exit 1
          fi
          # Any other shape, and a name that is empty either way, stops the
          # render instead of producing a Secret reference nothing resolves.
          for bad in 'imagePullSecrets: [{secretName: regcred}]' \
                     'imagePullSecrets: [""]' \
                     'imagePullSecrets: [{name: ""}]'; do
            printf 'global:\n  %s\n' "$bad" > /tmp/bad-pull-secrets.yaml
            if helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
              -f /tmp/bad-pull-secrets.yaml > /dev/null 2>&1; then
              echo "expected 'global.$bad' to fail the render" >&2
              exit 1
            fi
          done
          # The operator needs it as an env var too, for PlatformAgents this
          # release did not render.
          if ! helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            --set global.imagePullSecrets[0]=regcred \
            --set global.imagePullSecrets[1]=other \
            --show-only templates/operator-deployment.yaml \
            | grep -A1 IMAGE_PULL_SECRETS | grep -qF 'value: "regcred,other"'; then
            echo "IMAGE_PULL_SECRETS did not follow global.imagePullSecrets" >&2
            exit 1
          fi
          # Unset renders the key nowhere, which is what keeps a default install
          # byte-identical to one from before this value existed.
          if helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            | grep -qE "imagePullSecrets:|IMAGE_PULL_SECRETS"; then
            echo "imagePullSecrets rendered while global.imagePullSecrets is empty" >&2
            exit 1
          fi
          # The templates the derive-from-the-render loop above cannot see,
          # because they render only under non-default values: the hindsight
          # store (two pod specs) and the minter (one).
          gated=$(helm template test-release charts/kube-agents "${SET_FLAGS[@]}" \
            --set global.imagePullSecrets[0]=regcred \
            --set platformAgent.harness.memory.provider=hindsight \
            "${MINTER_FLAGS[@]}" --set githubMinter.appId=12345 \
            --show-only templates/hindsight.yaml \
            --show-only templates/github-minter.yaml)
          if [ "$(grep -cF 'name: "regcred"' <<<"$gated")" -ne 3 ]; then
            echo "global.imagePullSecrets did not reach all 3 hindsight/minter pod specs" >&2
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"

      - name: Enable Terraform plugin cache
        # Terraform does not tilde-expand TF_PLUGIN_CACHE_DIR, so the path
        # must be absolute — set it from $HOME at runtime.
        run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.terraform.d/plugin-cache"

      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('terraform/modules/*/versions.tf', 'terraform/examples/*/providers.tf') }}

      - name: Validate Terraform Modules
        run: |
          terraform fmt -check -recursive terraform/
          for dir in terraform/modules/* terraform/examples/*; do
            if [ -d "$dir" ]; then
              echo "Validating $dir..."
              (cd "$dir" && terraform init -backend=false && terraform validate)
            fi
          done
