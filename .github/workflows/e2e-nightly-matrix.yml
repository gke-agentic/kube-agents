name: E2E Nightly Full Matrix

# The nightly cron lives on staging-promote.yml, which calls this workflow as its
# test gate. Two schedules would have contended for the `rc-environment` lock
# below, and GitHub holds only one run pending per group -- the loser is dropped,
# not queued, so a nightly matrix and a nightly promotion racing at 02:00 would
# have silently lost one of them on most nights.
on:
  #checkov:skip=CKV_GHA_7:Manual test dispatch requires scenario and target environment filter parameters
  workflow_dispatch:
    inputs:
      stockout_scenarios:
        description: "Stockout scenario filter ('all' or comma-separated numbers, e.g. '01,02,04')"
        required: false
        default: "all"
        type: string
      fleet_audit_streams:
        description: "Fleet audit stream filter ('all' or specific streams, e.g. 'stockout-prevention')"
        required: false
        default: "all"
        type: string
      test_environment:
        description: "Target test environment ('nightly-e2e', 'rc-e2e', 'investigations-e2e', 'audit-e2e', 'agent-plugin-e2e', 'gchat-e2e', 'all')"
        required: false
        default: "nightly-e2e"
        type: choice
        options:
          - "nightly-e2e"
          - "rc-e2e"
          - "investigations-e2e"
          - "audit-e2e"
          - "agent-plugin-e2e"
          - "gchat-e2e"
          - "all"
      commit_sha:
        description: "Commit SHA to check out and to assert the cluster is running (Optional, Default: whatever is deployed)"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      stockout_scenarios:
        description: "Stockout scenario filter ('all' or comma-separated numbers, e.g. '01,02,04')"
        required: false
        default: "all"
        type: string
      fleet_audit_streams:
        description: "Fleet audit stream filter ('all' or specific streams, e.g. 'stockout-prevention')"
        required: false
        default: "all"
        type: string
      test_environment:
        description: "Target test environment name from tests/e2e/e2e_config.yaml"
        required: false
        default: "nightly-e2e"
        type: string
      commit_sha:
        description: "Immutable commit SHA to check out and to assert the cluster is running. Empty runs the caller's ref against whatever is deployed."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  run-full-e2e-matrix:
    name: Execute Full E2E Test Matrix
    if: github.repository == 'gke-labs/kube-agents' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The RC cluster is a singleton. Keep the group at job level rather than
    # workflow level: a called workflow's top-level `concurrency` does not apply
    # to the caller's run, so only this form still serializes against
    # rc-deploy-environment.yml and rc-release-pipeline.yml's test step.
    concurrency:
      group: rc-environment
      cancel-in-progress: false
    # vars.GCP_* are environment variables, not repository ones. Without this the
    # workload_identity_provider input resolves empty and google-github-actions/auth
    # fails before a single test runs -- which is what happened to the only
    # scheduled run this workflow ever had.
    environment: rc
    timeout-minutes: 90
    env:
      CLOUDSDK_PYTHON: "/usr/bin/python3"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Set up Python Environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Install Python Dependencies
        run: ./scripts/release/install_e2e_deps.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || '' }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || '' }}
          credentials_json: ${{ secrets.GCP_SA_KEY || '' }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "579.0.0"
          install_components: "beta,gke-gcloud-auth-plugin"

      - name: Authenticate to GKE
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GCP_REGION || 'us-east4' }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # COMMIT_SHA makes the script assert that platform-agent-gateway is running
      # the image built from that commit before any test executes. A promotion gate
      # that tests whatever the cluster happens to hold proves nothing about the
      # artifact it then promotes.
      - name: Connect to GKE & Verify Readiness
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
        run: ./scripts/release/wait_for_gke_readiness.sh

      - name: Configure Docker Authentication for Artifact Registry
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          REGION="${GCP_REGION:-us-east4}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet || true

      - name: Execute Full E2E Matrix (All Scenarios & Fleet Audit Streams)
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
          REGISTRY: ${{ vars.REGISTRY || vars.REGISTRY_PREFIX || (vars.GCP_PROJECT_ID && format('{0}-docker.pkg.dev/{1}/kube-agents', vars.GCP_REGION || 'us-east4', vars.GCP_PROJECT_ID)) || '' }}
          GITHUB_ORG: ${{ vars.GH_ORG || 'test-org-kube-agent' }}
          GITHUB_REPO: ${{ vars.GH_REPO || 'test-org-kube-agent/agents-repo' }}
          STOCKOUT_SCENARIOS: ${{ inputs.stockout_scenarios || 'all' }}
          FLEET_AUDIT_STREAMS: ${{ inputs.fleet_audit_streams || 'all' }}
          E2E_ENV: ${{ inputs.test_environment || 'nightly-e2e' }}
          CHAT_TOPIC_NAME: ${{ vars.CHAT_TOPIC_NAME }}
          E2E_CHAT_CLIENT_ID: ${{ secrets.E2E_CHAT_CLIENT_ID }}
          E2E_CHAT_CLIENT_SECRET: ${{ secrets.E2E_CHAT_CLIENT_SECRET }}
          E2E_CHAT_REFRESH_TOKEN: ${{ secrets.E2E_CHAT_REFRESH_TOKEN }}
          CHAT_SPACE_ID: ${{ secrets.E2E_CHAT_SPACE_ID }}
        run: make test-e2e
