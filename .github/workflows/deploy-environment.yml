name: "Shared: Deploy Environment"

permissions:
  contents: read

on:
  #checkov:skip=CKV_GHA_7:Standalone launch requires the candidate tag or commit SHA and the environment to build
  workflow_dispatch:
    inputs:
      github_environment:
        description: "GitHub environment supplying the GCP project, region and cluster"
        required: true
        type: choice
        options:
          - "rc"
          - "nightly"
      rc_tag:
        description: "Release Candidate Tag or Commit SHA (Mandatory for standalone launch)"
        required: true
        type: string
  workflow_call:
    inputs:
      # The GitHub Actions environment, and nothing else: it renders straight
      # into the job's `environment:` key below, and its values are `rc` and
      # `nightly`. Not `target_environment`, because `test_environment` already
      # exists on the E2E workflows naming a *test suite* (`rc`,
      # `nightly`), and two near-identical names for different things is how
      # that confusion propagates.
      #
      # required, with NO default. A `default: rc` would mean a nightly caller
      # that omits the input silently tears down and rebuilds the RC
      # environment, which is the one failure mode worth making impossible. The
      # cost is an explicit argument at each call site.
      github_environment:
        description: "GitHub environment supplying the GCP project, region and cluster"
        required: true
        type: string
      rc_tag:
        description: "Release Candidate Tag or Commit SHA"
        required: true
        type: string
    secrets:
      GEMINI_API_KEY:
        description: "Gemini API Key"
        required: true

jobs:
  deploy-environment:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    # One lock per environment, derived from the same input. `rc` still yields
    # `rc-environment`, so the RC pipeline's serialisation is unchanged, and the
    # nightly pipeline takes `nightly-environment` instead of contending for a
    # cluster it does not deploy to.
    concurrency:
      group: ${{ inputs.github_environment }}-environment
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDSDK_PYTHON: "/usr/bin/python3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve Commit SHA from Release Tag
        id: resolve_target
        env:
          RC_TAG: ${{ inputs.rc_tag }}
          GH_ORG: ${{ vars.GH_ORG }}
          GH_REPO: ${{ vars.GH_REPO }}
        run: ./scripts/release/resolve_rc_tag.sh

      - name: Checkout repository at exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve_target.outputs.commit_sha }}
          persist-credentials: false

      - name: Validate & Log Deployment Configuration Summary
        env:
          RC_TAG: ${{ steps.resolve_target.outputs.rc_tag }}
          COMMIT_SHA: ${{ steps.resolve_target.outputs.commit_sha }}
          IMAGE_TAG: ${{ steps.resolve_target.outputs.commit_sha }}
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CHAT_ENABLED: ${{ vars.GOOGLE_CHAT_ENABLED }}
          GOOGLE_CHAT_MODE: ${{ vars.GOOGLE_CHAT_MODE }}
          CHAT_TOPIC_NAME: ${{ vars.CHAT_TOPIC_NAME }}
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
          MODEL_DEFAULT_NAME: ${{ vars.MODEL_DEFAULT_NAME }}
          ENABLE_GVISOR: ${{ vars.ENABLE_GVISOR }}
          ENABLE_GKE_BACKUP_PLAN: ${{ vars.ENABLE_GKE_BACKUP_PLAN }}
          PLATFORM_AGENT_PERMISSION_SET: ${{ vars.PLATFORM_AGENT_PERMISSION_SET }}
          MEMORY_PROVIDER: ${{ vars.MEMORY_PROVIDER }}
          USER_PROFILE_ENABLED: ${{ vars.USER_PROFILE_ENABLED }}
        run: ./scripts/release/validate_and_log_deploy_summary.sh

      - name: Authenticate to GCP via Workload Identity Federation (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "579.0.0"
          install_components: "beta,gke-gcloud-auth-plugin"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "k8s-operator/go.mod"
          cache-dependency-path: "k8s-operator/go.sum"

      # The teardown half of the step below needs this. install.sh auto-installs
      # terraform, but only once it is already running — uninstall.sh installs
      # nothing and refuses without it, so before this step existed the RC
      # teardown failed on every run and the pipeline reinstalled over the
      # surviving environment.
      #
      # terraform_wrapper: false is load-bearing. The wrapper replaces terraform
      # with a script that re-prints stdout and stderr for its outputs, and
      # lifecycle.sh reads terraform's stdout directly — `terraform console` for
      # resolved variables and `terraform state list` for what exists. Left on,
      # those captures pick up the wrapper's copy as well as the real output.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Provision Environment in GCP
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
          IMAGE_TAG: ${{ steps.resolve_target.outputs.commit_sha }}
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
          GOOGLE_CHAT_ENABLED: ${{ vars.GOOGLE_CHAT_ENABLED }}
          GOOGLE_CHAT_MODE: ${{ vars.GOOGLE_CHAT_MODE }}
          CHAT_TOPIC_NAME: ${{ vars.CHAT_TOPIC_NAME }}
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
          MODEL_DEFAULT_NAME: ${{ vars.MODEL_DEFAULT_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENABLE_GVISOR: ${{ vars.ENABLE_GVISOR }}
          ENABLE_GKE_BACKUP_PLAN: ${{ vars.ENABLE_GKE_BACKUP_PLAN }}
          PLATFORM_AGENT_PERMISSION_SET: ${{ vars.PLATFORM_AGENT_PERMISSION_SET }}
          MEMORY_PROVIDER: ${{ vars.MEMORY_PROVIDER }}
          USER_PROFILE_ENABLED: ${{ vars.USER_PROFILE_ENABLED }}
          # The GitOps repository the agent targets, and the one the GitHub token
          # minter scopes its tokens to. Deliberately NOT vars.GH_ORG/vars.GH_REPO,
          # which every other workflow does use for this: on the `rc` environment
          # that pair names the RELEASE repository (gke-labs/kube-agents) and is
          # what common.sh's get_target_repo resolves for tag and release
          # operations. Reusing it here would scope a live GitHub App token to this
          # repository. GITOPS_REPO is bare — installer_common.sh composes
          # github_repo as "${GITHUB_ORG}/${GITHUB_REPO}".
          #
          # All three must be set before the minter is provisioned at all
          # (the three-way guard in installer_common.sh's write_tfvars_from_state);
          # with any of them empty the install is
          # byte-identical to today's. The pair must also match the repository the
          # E2E suite probes — a token minted for one repository does not
          # authenticate against another. `rc` and `nightly` deliberately
          # pin neither in tests/e2e/e2e_config.yaml, precisely so the value lives
          # in one place: e2e-run.yml passes this same GITOPS_ORG/GITOPS_REPO pair
          # to the suite, and conftest.py's _qualify_repo composes the bare
          # repository name against the org.
          GITHUB_ORG: ${{ vars.GITOPS_ORG }}
          GITHUB_REPO: ${{ vars.GITOPS_REPO }}
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          # Optional, and the lesser of the two routes. Importing the App's private
          # key into the minter's KMS key by hand is the better one: the key ring
          # survives every teardown, so the import is a one-off and the signing
          # material never enters Actions. This is the bootstrap path — set it and
          # provision_environment.sh writes it to a private temporary file,
          # because install.sh takes a path (GITHUB_PEM_PATH) and never a value.
          # Either way the import is skipped once the key has an enabled version.
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # Unset (the default) reports a failed teardown as an annotation and
          # a job-summary entry and provisions on top of whatever survived;
          # truthy makes it a hard stop. Which of those is right depends on
          # whether a candidate validated against stale state or a blocked
          # release is the worse outcome that week, so it is a variable rather
          # than a constant here.
          #
          # Set it on each environment this workflow is called with, alongside
          # GCP_PROJECT_ID and the rest — the bound environment is where every
          # other value this job reads comes from, and the repository level
          # holds none of them.
          # `vars` resolves environment over repository over organization, so a
          # repository-level one works too and is the easier of the two to set
          # by accident and then not find again.
          # Both spellings forwarded: teardown_common.sh prefers TEARDOWN_STRICT
          # and falls back to the RC_-prefixed one the environment settings still
          # carry, so the settings rename can happen on either side of this merge.
          # Drop the second line once `rc` and `nightly` both define the new name.
          TEARDOWN_STRICT: ${{ vars.TEARDOWN_STRICT }}
          RC_TEARDOWN_STRICT: ${{ vars.RC_TEARDOWN_STRICT }}
        run: ./scripts/release/provision_environment.sh
