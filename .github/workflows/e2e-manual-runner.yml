name: "E2E: Manual Runner"

on:
  #checkov:skip=CKV_GHA_7:Manual E2E test runner requires environment and scenario filter parameters
  workflow_dispatch:
    inputs:
      # Without this the job binds to no GitHub environment, every `vars.*`
      # below resolves to empty — the repository scope holds none of these —
      # and google-github-actions/auth fails with "must specify exactly one of
      # workload_identity_provider or credentials_json". That is why this
      # workflow has never had a successful run.
      #
      # An input rather than a hardcoded `rc`, because this is dispatch-only and
      # legitimately wants to target whichever environment is standing:
      # `nightly` while a failed nightly run's cluster is up for diagnosis, `rc`
      # while a failed RC run's is. Note that both are ephemeral — a passing
      # pipeline destroys its cluster, so most of the time there is nothing here
      # to run against.
      github_environment:
        description: "GitHub environment whose cluster to run against"
        required: true
        type: choice
        options:
          - "rc"
          - "nightly"
      # `test_suite`, not `test_environment`: this names a list of test files in
      # e2e_config.yaml, while `github_environment` above names the GitHub
      # environment supplying the cluster. The two used to be one letter apart.
      test_suite:
        description: "Target test suite (rc, nightly, investigations, audit, agent-plugin, gchat, all)"
        required: false
        default: "rc"
        type: choice
        options:
          - "rc"
          - "nightly"
          - "investigations"
          - "audit"
          - "agent-plugin"
          - "gchat"
          - "all"
      stockout_scenarios:
        description: "Stockout scenarios ('04' for fast smoke, 'all' for full matrix)"
        required: false
        default: "04"
        type: string
      fleet_audit_streams:
        description: "Fleet audit stream filter ('all', 'stockout-prevention', or specific stream)"
        required: false
        default: "all"
        type: string
      rebuild_operator:
        description: "Rebuild operator from source (true / false)"
        required: false
        default: "false"
        type: string
      test_destructive_crd:
        description: "Test destructive CRD deletion safeguard (true / false)"
        required: false
        default: "false"
        type: string

# Follows the environment it was dispatched against. Hardcoding `rc-environment`
# here used to make this workflow contend with the RC pipeline for a cluster it
# does not deploy to, whichever environment it was actually pointed at.
concurrency:
  group: ${{ inputs.github_environment }}-environment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  run-e2e:
    name: Run E2E (${{ inputs.test_suite || 'rc' }} on ${{ inputs.github_environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    timeout-minutes: 45

    env:
      CLOUDSDK_PYTHON: "/usr/bin/python3"
      USE_GKE_GCLOUD_AUTH_PLUGIN: "True"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python Environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Install Python Dependencies
        run: ./scripts/release/install_e2e_deps.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || '' }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || '' }}
          credentials_json: ${{ secrets.GCP_SA_KEY || '' }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "579.0.0"
          install_components: "beta,gke-gcloud-auth-plugin"

      - name: Authenticate to GKE
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GCP_REGION || 'us-east4' }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Connect to GKE & Configure Docker
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
        run: |
          ./scripts/release/wait_for_gke_readiness.sh
          REGION="${GCP_REGION:-us-east4}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet || true

      - name: Execute E2E Tests
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
          AGENT_NAMESPACE: ${{ vars.AGENT_NAMESPACE || 'kubeagents-system' }}
          REGISTRY: ${{ vars.REGISTRY || vars.REGISTRY_PREFIX || (vars.GCP_PROJECT_ID && format('{0}-docker.pkg.dev/{1}/kube-agents', vars.GCP_REGION || 'us-east4', vars.GCP_PROJECT_ID)) || '' }}
          # GITOPS_*, not GH_*. On both `rc` and `nightly` the GH_ORG/GH_REPO
          # pair names the RELEASE repository (gke-labs/kube-agents), which is
          # what common.sh's get_target_repo resolves for tag operations —
          # handing it to a suite that mints a GitHub App token would scope a
          # live token at this repository. GITOPS_REPO is bare; the conftest
          # github_repo fixture composes owner/repo from GITHUB_ORG.
          GITHUB_ORG: ${{ vars.GITOPS_ORG }}
          GITHUB_REPO: ${{ vars.GITOPS_REPO }}
          TEST_SUITE: ${{ inputs.test_suite }}
          STOCKOUT_SCENARIOS: ${{ inputs.stockout_scenarios }}
          FLEET_AUDIT_STREAMS: ${{ inputs.fleet_audit_streams || 'all' }}
          REBUILD_OPERATOR: ${{ inputs.rebuild_operator }}
          TEST_DESTRUCTIVE_CRD: ${{ inputs.test_destructive_crd }}
          CHAT_TOPIC_NAME: ${{ vars.CHAT_TOPIC_NAME }}
          E2E_CHAT_CLIENT_ID: ${{ secrets.E2E_CHAT_CLIENT_ID }}
          E2E_CHAT_CLIENT_SECRET: ${{ secrets.E2E_CHAT_CLIENT_SECRET }}
          E2E_CHAT_REFRESH_TOKEN: ${{ secrets.E2E_CHAT_REFRESH_TOKEN }}
          CHAT_SPACE_ID: ${{ secrets.E2E_CHAT_SPACE_ID }}
        run: |
          TARGET_SUITE="$TEST_SUITE"
          if [ "$TARGET_SUITE" = "all" ]; then
            python3 scripts/release/execute_e2e_tests.py --suite all
          else
            python3 scripts/release/execute_e2e_tests.py --suite "$TARGET_SUITE"
          fi
