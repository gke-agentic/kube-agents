name: RC Step 2 - Deploy Environment

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Git Commit SHA (Default: Current SHA)"
        required: false
        type: string
      rc_tag:
        description: "Release Candidate Tag (Mandatory for Step 2 standalone launch)"
        required: false
        type: string
      run_subsequent_steps:
        description: "Run subsequent testing & validation steps after deploy?"
        type: boolean
        default: false
  workflow_call:
    inputs:
      commit_sha:
        required: false
        type: string
      rc_tag:
        required: false
        type: string

jobs:
  deploy-rc:
    runs-on: ubuntu-latest
    environment: rc
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      REGION: ${{ vars.GCP_REGION }}
      CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
      GOOGLE_CHAT_ENABLED: ${{ vars.GOOGLE_CHAT_ENABLED }}
      GOOGLE_CHAT_MODE: ${{ vars.GOOGLE_CHAT_MODE }}
      E2E_CHAT_TOPIC_NAME: ${{ vars.E2E_CHAT_TOPIC_NAME }}
      MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
      MODEL_DEFAULT_NAME: ${{ vars.MODEL_DEFAULT_NAME }}
      ENABLE_GVISOR: ${{ vars.ENABLE_GVISOR }}
      PLATFORM_AGENT_PERMISSION_SET: ${{ vars.PLATFORM_AGENT_PERMISSION_SET }}
      MEMORY_ENABLED: ${{ vars.MEMORY_ENABLED }}
      MEMORY_PROVIDER: ${{ vars.MEMORY_PROVIDER }}
      USER_PROFILE_ENABLED: ${{ vars.USER_PROFILE_ENABLED }}
      # TODO(POC): Temporary 3-element fallback chain. Revert fallback 1810fac241a9540f943e9722c38ab45135905e06 before merging PR 2 to main.
      IMAGE_TAG: ${{ inputs.commit_sha || github.sha || '1810fac241a9540f943e9722c38ab45135905e06' }}
      CI: "true"

    steps:
      - name: Validate Release Candidate Tag & Commit
        id: validate
        run: |
          TARGET_SHA="${{ inputs.commit_sha || github.sha }}"
          TAG_VAL="${{ inputs.rc_tag }}"

          if [ -z "$TAG_VAL" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "❌ ERROR: No Release Candidate tag ('rc_*') provided!"
            echo "Direct deployment to 'kube-agents-rc' is restricted to official Release Candidates."
            echo "Please create an 'rc_*' tag on commit ${TARGET_SHA} or start the pipeline from Step 1 (Create Tag)."
            exit 1
          fi

          echo "commit_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "rc_tag=${TAG_VAL:-rc_poc}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository at exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.validate.outputs.commit_sha }}

      - name: Authenticate to GCP via Workload Identity Federation (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "beta,gke-gcloud-auth-plugin"

      - name: Log Deployment Configuration Summary
        run: |
          echo "======================================================================"
          echo "🚀 RELEASE CANDIDATE DEPLOYMENT CONFIGURATION"
          echo "======================================================================"
          echo "Target Project ID:          ${PROJECT_ID:-<NOT SET IN ENVIRONMENT>}"
          echo "Target Project Number:      ${PROJECT_NUMBER:-<NOT SET IN ENVIRONMENT>}"
          echo "Target GCP Region:          ${REGION:-<NOT SET IN ENVIRONMENT>}"
          echo "Target Cluster Name:        ${CLUSTER_NAME:-<NOT SET IN ENVIRONMENT>}"
          echo "Service Account:            ${{ vars.GCP_SERVICE_ACCOUNT }}"
          echo "----------------------------------------------------------------------"
          echo "Candidate Commit SHA:       ${{ steps.validate.outputs.commit_sha }}"
          echo "Candidate Image Tag:        ${IMAGE_TAG}"
          echo "----------------------------------------------------------------------"
          echo "Google Chat Enabled:        ${GOOGLE_CHAT_ENABLED:-<NOT SET IN ENVIRONMENT>}"
          echo "Google Chat Mode:           ${GOOGLE_CHAT_MODE:-<NOT SET IN ENVIRONMENT>}"
          echo "Google Chat Topic Name:     ${E2E_CHAT_TOPIC_NAME:-<NOT SET IN ENVIRONMENT>}"
          echo "----------------------------------------------------------------------"
          echo "Model Provider:             ${MODEL_PROVIDER:-<NOT SET IN ENVIRONMENT>}"
          echo "Model Default Name:         ${MODEL_DEFAULT_NAME:-<NOT SET IN ENVIRONMENT>}"
          echo "Enable gVisor Isolation:    ${ENABLE_GVISOR:-<NOT SET IN ENVIRONMENT>}"
          echo "Agent K8s Permission Set:   ${PLATFORM_AGENT_PERMISSION_SET:-<NOT SET IN ENVIRONMENT>}"
          echo "Memory Enabled:             ${MEMORY_ENABLED:-<NOT SET IN ENVIRONMENT>}"
          echo "Memory Provider:            ${MEMORY_PROVIDER:-<NOT SET IN ENVIRONMENT>}"
          echo "User Profile Enabled:       ${USER_PROFILE_ENABLED:-<NOT SET IN ENVIRONMENT>}"
          echo "======================================================================"

      - name: Provision Environment in GCP
        run: |
          # TODO(POC): Temporary disabled teardown.sh for faster POC testing. Uncomment before main.
          # ./k8s-operator/scripts/teardown.sh --no-confirm
          ./k8s-operator/scripts/provision.sh --no-confirm
