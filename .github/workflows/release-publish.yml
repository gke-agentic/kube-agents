name: Release & Publish (GA)

on:
  # Weekly GA release, unattended. 02:17 UTC on Friday falls in the gap between
  # the two teams that work on this repository: Thursday evening in Waterloo,
  # pre-dawn Friday in Warsaw. A release landing there has nobody mid-change
  # when it cuts the tag, and Warsaw picks the result up at the start of their
  # Friday rather than hours after the fact.
  #
  # GitHub crons are UTC and do not follow daylight saving, and the two cities
  # do not switch on the same date as each other either: North America springs
  # forward first and falls back last, so for a few Fridays each spring and
  # autumn Waterloo is on EDT while Warsaw is on CET. The local pair therefore
  # drifts over the year across 21:17/03:17, 22:17/03:17 and 22:17/04:17, and
  # every one of those stays inside the window. Minute 17
  # rather than 00 for the reason `scripts/release/README.md` gives for the RC
  # pipeline: top-of-the-hour is when the Actions scheduler is most congested,
  # and a scheduled run is best-effort either way.
  #
  # `scripts/release/README.md` owns what an unattended run does when there is
  # nothing new to release -- and the one case where that quiet path does not
  # hold.
  schedule:
    - cron: "17 2 * * 5"
  #checkov:skip=CKV_GHA_7:GA release publish workflow requires explicit version override, target commit, and emergency bypass parameters
  workflow_dispatch:
    inputs:
      explicit_release_version:
        description: "Explicit release version override (e.g. 0.2.0). If omitted, automatically calculated via Conventional Commits."
        required: false
        type: string
      target_commit:
        description: "Target commit SHA. If omitted, automatically resolved from the latest commit with an 'rc_*_validated' tag."
        required: false
        type: string
      skip_rc_validation:
        description: "Emergency override: bypass live RC GKE validation check."
        required: false
        type: boolean
        default: false
      emergency_override_reason:
        description: "Required audit justification when skip_rc_validation is enabled."
        required: false
        type: string

# Single global concurrency lock prevents concurrent release runs
concurrency:
  group: kube-agents-release-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-release:
    name: Publish GA Release
    runs-on: ubuntu-latest
    # The repository guard is load-bearing now that a cron triggers this
    # workflow: a fork inherits the schedule but none of the release
    # credentials, so an unguarded weekly run would fail there and mail the fork
    # owner. On a `schedule` event `github.ref` is the default branch, so the
    # second clause holds for the cron and pins a manual dispatch to `main`.
    if: github.repository == 'gke-labs/kube-agents' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      - name: Calculate Next Release Version
        id: calculate-version
        env:
          EXPLICIT_RELEASE_VERSION: ${{ inputs.explicit_release_version }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          SKIP_RC_VALIDATION: ${{ inputs.skip_rc_validation }}
        run: ./scripts/release/calculate_next_version.sh

      - name: Verify Release Eligibility
        id: verify-eligibility
        env:
          RELEASE_VERSION: ${{ steps.calculate-version.outputs.release_version }}
          RELEASE_COMMIT: ${{ steps.calculate-version.outputs.release_commit }}
          SKIP_RC_VALIDATION: ${{ inputs.skip_rc_validation }}
          EMERGENCY_OVERRIDE_REASON: ${{ inputs.emergency_override_reason }}
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: ./scripts/release/verify_release_eligibility.sh

      - name: Set up Docker Buildx
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote Release Container Images
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        env:
          RELEASE_COMMIT: ${{ steps.calculate-version.outputs.release_commit }}
          RELEASE_VERSION: ${{ steps.calculate-version.outputs.release_version }}
        run: ./scripts/release/promote_release_images.sh

      - name: Install Cosign
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Promoted Container Images
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        env:
          RELEASE_VERSION: ${{ steps.calculate-version.outputs.release_version }}
        run: ./scripts/release/sign_release_images.sh

      - name: Set up Helm
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Package, Publish and Sign Helm Chart
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        env:
          RELEASE_VERSION: ${{ steps.calculate-version.outputs.release_version }}
          RELEASE_COMMIT: ${{ steps.calculate-version.outputs.release_commit }}
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: ./scripts/release/publish_helm_chart.sh

      - name: Create Git Tag
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        env:
          RELEASE_VERSION: ${{ steps.calculate-version.outputs.release_version }}
          RELEASE_COMMIT: ${{ steps.calculate-version.outputs.release_commit }}
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: ./scripts/release/tag_ga_release.sh

      - name: Publish GitHub Release
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        env:
          RELEASE_VERSION: ${{ steps.calculate-version.outputs.release_version }}
          RELEASE_COMMIT: ${{ steps.calculate-version.outputs.release_commit }}
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: ./scripts/release/publish_github_release.sh
