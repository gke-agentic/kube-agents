name: Release & Publish (GA)

on:
  # Nightly attempt, weekly outcome. The cadence is decided by
  # resolve_scheduled_release.sh rather than by this expression: it releases at
  # most once per Friday-anchored cycle, and the other six nights exist so that
  # a cycle blocked by a red staging gate can still ship the moment the gate
  # goes green, instead of waiting a whole week for the next cron tick.
  #
  # 01:17 UTC is chosen against two constraints. It is before staging-promote.yml
  # starts at 02:00, so this reads a completed gate result rather than racing a
  # matrix that is still running, and on the Friday that usually carries the
  # release it falls between the two teams working on this repository --
  # Thursday evening in Waterloo, pre-dawn Friday in Warsaw. Nobody is
  # mid-change when the tag is cut, and Warsaw picks the result up at the start
  # of their day.
  #
  # GitHub crons are UTC and do not follow daylight saving, and the two cities
  # do not switch on the same date as each other either: North America springs
  # forward first and falls back last, so for a few Fridays each spring and
  # autumn Waterloo is on EDT while Warsaw is on CET. The local pair drifts over
  # the year across 20:17/02:17, 21:17/02:17 and 21:17/03:17, all of which stay
  # inside the window. Minute 17 rather than 00 for the reason
  # `scripts/release/README.md` gives for the RC pipeline: top-of-the-hour is
  # when the Actions scheduler is most congested, and a scheduled run is
  # best-effort either way.
  schedule:
    - cron: "17 1 * * *"
  #checkov:skip=CKV_GHA_7:GA release publish workflow requires explicit version override, target commit, and emergency bypass parameters
  workflow_dispatch:
    inputs:
      explicit_release_version:
        description: "Explicit release version override (e.g. 0.2.0). If omitted, automatically calculated via Conventional Commits."
        required: false
        type: string
      target_commit:
        description: "Target commit SHA. If omitted, automatically resolved from the latest commit with an 'rc_*_validated' tag."
        required: false
        type: string
      skip_rc_validation:
        description: "Emergency override: bypass live RC GKE validation check."
        required: false
        type: boolean
        default: false
      emergency_override_reason:
        description: "Required audit justification when skip_rc_validation is enabled."
        required: false
        type: string

# Single global concurrency lock prevents concurrent release runs
concurrency:
  group: kube-agents-release-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Everything that decides *whether* to release lives here, and nothing that
  # decides *what* to publish does. Keeping it in its own job rather than as a
  # first step of publish-release means the decision is one `if:` on the job
  # below instead of a condition repeated on every publishing step, which would
  # otherwise have to be re-added to each new step somebody appends.
  evaluate-schedule:
    name: Decide Whether To Release
    runs-on: ubuntu-latest
    # A fork inherits the cron but none of the release credentials. The guard
    # repeats on both jobs rather than relying on the skip cascading through
    # `needs`: an `always()` added to the publish job later would silently
    # un-guard it.
    if: github.repository == 'gke-labs/kube-agents' && github.ref == 'refs/heads/main'
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      release_commit: ${{ steps.decide.outputs.release_commit }}
    steps:
      # Unconditional, though only the scheduled path reads it: a checkout
      # skipped on the dispatch path would leave the step below invoking a
      # script that is not on disk if the short-circuit is ever reordered.
      # `fetch-depth: 0` because the decision is made entirely out of tags.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      # A manual dispatch is a human deciding, which is the whole of the gate
      # this job implements. It short-circuits to `true` so that every
      # workflow_dispatch behaves exactly as it did before the cron existed --
      # including the emergency path, which is unreachable from a schedule.
      - name: Decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" != "schedule" ]; then
            echo "Manual dispatch — the decision to release has already been made."
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
            echo "release_commit=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          ./scripts/release/resolve_scheduled_release.sh

  publish-release:
    name: Publish GA Release
    runs-on: ubuntu-latest
    needs: evaluate-schedule
    # Same repository/branch guard as the gate job, plus its verdict. On a
    # `schedule` event `github.ref` is the default branch, so the second clause
    # holds for the cron and pins a manual dispatch to `main`.
    if: |
      github.repository == 'gke-labs/kube-agents' &&
      github.ref == 'refs/heads/main' &&
      needs.evaluate-schedule.outputs.should_release == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      - name: Calculate Next Release Version
        id: calculate-version
        env:
          EXPLICIT_RELEASE_VERSION: ${{ inputs.explicit_release_version }}
          # A scheduled run releases the commit that passed the staging gate,
          # not merely the newest rc_*_validated one the scripts would resolve
          # on their own. `inputs.target_commit` is empty on a schedule event,
          # so this falls through to the gate's answer; on a dispatch the gate
          # returns empty and a named commit — or the scripts' own resolution —
          # wins, exactly as before.
          TARGET_COMMIT: ${{ inputs.target_commit || needs.evaluate-schedule.outputs.release_commit }}
          SKIP_RC_VALIDATION: ${{ inputs.skip_rc_validation }}
        run: ./scripts/release/calculate_next_version.sh

      - name: Verify Release Eligibility
        id: verify-eligibility
        env:
          RELEASE_VERSION: ${{ steps.calculate-version.outputs.release_version }}
          RELEASE_COMMIT: ${{ steps.calculate-version.outputs.release_commit }}
          SKIP_RC_VALIDATION: ${{ inputs.skip_rc_validation }}
          EMERGENCY_OVERRIDE_REASON: ${{ inputs.emergency_override_reason }}
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: ./scripts/release/verify_release_eligibility.sh

      - name: Set up Docker Buildx
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote Release Container Images
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        env:
          RELEASE_COMMIT: ${{ steps.calculate-version.outputs.release_commit }}
          RELEASE_VERSION: ${{ steps.calculate-version.outputs.release_version }}
        run: ./scripts/release/promote_release_images.sh

      - name: Install Cosign
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Promoted Container Images
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        env:
          RELEASE_VERSION: ${{ steps.calculate-version.outputs.release_version }}
        run: ./scripts/release/sign_release_images.sh

      - name: Set up Helm
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Package, Publish and Sign Helm Chart
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        env:
          RELEASE_VERSION: ${{ steps.calculate-version.outputs.release_version }}
          RELEASE_COMMIT: ${{ steps.calculate-version.outputs.release_commit }}
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: ./scripts/release/publish_helm_chart.sh

      - name: Create Git Tag
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        env:
          RELEASE_VERSION: ${{ steps.calculate-version.outputs.release_version }}
          RELEASE_COMMIT: ${{ steps.calculate-version.outputs.release_commit }}
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: ./scripts/release/tag_ga_release.sh

      - name: Publish GitHub Release
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        env:
          RELEASE_VERSION: ${{ steps.calculate-version.outputs.release_version }}
          RELEASE_COMMIT: ${{ steps.calculate-version.outputs.release_commit }}
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: ./scripts/release/publish_github_release.sh
