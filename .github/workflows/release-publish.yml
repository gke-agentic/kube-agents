name: Release & Publish (GA)

on:
  workflow_dispatch:
    inputs:
      explicit_release_version:
        description: "Explicit release version override (e.g. 0.2.0). If omitted, automatically calculated via Conventional Commits."
        required: false
        type: string
      target_commit:
        description: "Target commit SHA. If omitted, automatically resolved from the latest commit with an 'rc_*_validated' tag."
        required: false
        type: string
      skip_rc_validation:
        description: "Emergency override: bypass live RC GKE validation check."
        required: false
        type: boolean
        default: false
      emergency_override_reason:
        description: "Required audit justification when skip_rc_validation is enabled."
        required: false
        type: string

# Single global concurrency lock prevents concurrent release runs
concurrency:
  group: kube-agents-release-publish
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish-release:
    name: Publish GA Release
    runs-on: ubuntu-latest
    if: github.repository == 'gke-labs/kube-agents'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve Release Version
        id: resolve-version
        env:
          EXPLICIT_RELEASE_VERSION: ${{ inputs.explicit_release_version }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          ./scripts/release/calculate_next_version.sh "" "${TARGET_COMMIT:-HEAD}"

      - name: Verify Release Eligibility
        id: verify-eligibility
        env:
          TARGET_VERSION: ${{ steps.resolve-version.outputs.version }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          SKIP_RC_VALIDATION: ${{ inputs.skip_rc_validation }}
          EMERGENCY_OVERRIDE_REASON: ${{ inputs.emergency_override_reason }}
        run: |
          ./scripts/release/verify_release_eligibility.sh "${TARGET_VERSION}" "${TARGET_COMMIT:-}"

      - name: Create Git Tag
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        env:
          RELEASE_VERSION: ${{ steps.resolve-version.outputs.version }}
          RELEASE_COMMIT: ${{ steps.verify-eligibility.outputs.release_commit }}
        run: |
          ./scripts/release/tag_ga_release.sh "${RELEASE_VERSION}" "${RELEASE_COMMIT}"

      - name: Set up Docker Buildx
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote Release Container Images
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        env:
          RELEASE_COMMIT: ${{ steps.verify-eligibility.outputs.release_commit }}
          RELEASE_VERSION: ${{ steps.resolve-version.outputs.version }}
        run: |
          ./scripts/release/promote_release_images.sh "${RELEASE_COMMIT}" "${RELEASE_VERSION}"

      - name: Install Cosign
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Promoted Container Images
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        env:
          RELEASE_VERSION: ${{ steps.resolve-version.outputs.version }}
        run: |
          ./scripts/release/sign_release_images.sh "${RELEASE_VERSION}"

      # Note: If repository tag/release protection rules restrict github-actions[bot],
      # this step or git tag push may fail with 403 unless GITHUB_TOKEN has bypass permissions.
      - name: Publish GitHub Release
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        env:
          RELEASE_VERSION: ${{ steps.resolve-version.outputs.version }}
          RELEASE_COMMIT: ${{ steps.verify-eligibility.outputs.release_commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/release/publish_github_release.sh "${RELEASE_VERSION}" "${RELEASE_COMMIT}"
