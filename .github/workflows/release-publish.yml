name: Release & Publish (GA)

# Promotes a gate-passing commit to a GA release: SemVer from Conventional
# Commits, a tag, promoted and signed images, a Helm chart, a GitHub Release.
#
# Everything that decides *whether* to release now lives in the
# `evaluate-schedule` job, and everything that decides *what* to publish stays
# where it was. That split is what an unattended run needs: it adds the halt on a
# breaking change, which the publishing path has no counterpart for, and it keeps
# the two shapes that do exit 1 with nothing to ship — no rc_*_validated tag at
# all, and a GA tag left by an emergency release on a commit that is not the
# candidate's stamped child — from being a red run nobody reads.
#
# Dispatch-only on purpose. The gate is built and tested, but turning the
# schedule on is its own decision and its own reviewable change: exercise it by
# hand with `schedule_gate: dry-run`, then `evaluate`, and add the `schedule:`
# block once a real cron tick would have done the right thing.
#
# `scripts/release/README.md`, "The weekly GA release", is canonical for the cron
# value and the reasoning behind it — do not restate either here.

on:
  #checkov:skip=CKV_GHA_7:GA release publish workflow requires explicit version override, target commit, emergency bypass and schedule-gate parameters
  workflow_dispatch:
    inputs:
      schedule_gate:
        description: "bypass = publish (a human decided) · dry-run = report the scheduled verdict, publish nothing · evaluate = act on it, exactly as the cron would"
        required: false
        type: choice
        default: bypass
        options:
          - bypass
          - dry-run
          - evaluate
      explicit_release_version:
        description: "Explicit release version override (e.g. 0.2.0). If omitted, automatically calculated via Conventional Commits."
        required: false
        type: string
      target_commit:
        description: "Target commit SHA. If omitted, automatically resolved from the latest commit with an 'rc_*_validated' tag."
        required: false
        type: string
      skip_rc_validation:
        description: "Emergency override: bypass live RC GKE validation check."
        required: false
        type: boolean
        default: false
      emergency_override_reason:
        description: "Required audit justification when skip_rc_validation is enabled."
        required: false
        type: string

# Single global concurrency lock prevents concurrent release runs
concurrency:
  group: kube-agents-release-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Everything that decides *whether* to release lives here, and nothing that
  # decides *what* to publish does. Keeping it in its own job rather than as a
  # first step of publish-release makes the verdict one `if:` on the job below,
  # instead of a condition repeated on every publishing step that whoever
  # appends the next step has to remember to repeat again.
  evaluate-schedule:
    name: Decide Whether To Release
    runs-on: ubuntu-latest
    # A fork inherits workflow_dispatch — and would inherit the cron — but none
    # of the release credentials. The guard repeats on both jobs rather than
    # relying on the skip cascading through `needs`: an `always()` added to the
    # publish job later would silently un-guard it.
    if: github.repository == 'gke-labs/kube-agents' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    # No `permissions:` block: this job only reads tags, and write access
    # belongs to the job that publishes. The workflow-level `contents: read`
    # applies.
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      release_commit: ${{ steps.decide.outputs.release_commit }}
    steps:
      # `fetch-depth: 0` because the decision is made entirely out of the tag
      # graph and the commit range behind it. `persist-credentials: false`
      # because nothing here pushes.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_GATE: ${{ inputs.schedule_gate }}
        run: ./scripts/release/decide_release_gate.sh

  publish-release:
    name: Publish GA Release
    runs-on: ubuntu-latest
    needs: evaluate-schedule
    # The same repository and branch guard as the gate job, plus its verdict.
    # On a `schedule` event `github.ref` is the default branch, so the second
    # clause holds for a cron tick and pins a manual dispatch to `main`.
    if: |
      github.repository == 'gke-labs/kube-agents' &&
      github.ref == 'refs/heads/main' &&
      needs.evaluate-schedule.outputs.should_release == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      - name: Calculate Next Release Version
        id: calculate-version
        env:
          EXPLICIT_RELEASE_VERSION: ${{ inputs.explicit_release_version }}
          # An unattended run releases the exact commit the gate passed, not
          # merely whatever the scripts would auto-resolve. `inputs.target_commit`
          # is empty on a schedule event, so this falls through to the gate's
          # answer; on a bypassing dispatch the gate returns empty and a named
          # commit — or the scripts' own resolution — wins, exactly as before.
          #
          # Today the two agree: the gate reads the newest rc_*_validated tag and
          # so does calculate_next_version.sh. They stop agreeing the moment the
          # gate moves to the staging tag, and dropping this fallback then makes
          # the gate decorative without anything looking wrong.
          TARGET_COMMIT: ${{ inputs.target_commit || needs.evaluate-schedule.outputs.release_commit }}
          SKIP_RC_VALIDATION: ${{ inputs.skip_rc_validation }}
        run: ./scripts/release/calculate_next_version.sh

      - name: Verify Release Eligibility
        id: verify-eligibility
        env:
          RELEASE_VERSION: ${{ steps.calculate-version.outputs.release_version }}
          RC_CANDIDATE_COMMIT: ${{ steps.calculate-version.outputs.rc_candidate_commit }}
          SKIP_RC_VALIDATION: ${{ inputs.skip_rc_validation }}
          EMERGENCY_OVERRIDE_REASON: ${{ inputs.emergency_override_reason }}
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: ./scripts/release/verify_release_eligibility.sh

      - name: Create Git Tag
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        env:
          RELEASE_VERSION: ${{ steps.calculate-version.outputs.release_version }}
          RC_CANDIDATE_COMMIT: ${{ steps.calculate-version.outputs.rc_candidate_commit }}
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: ./scripts/release/tag_ga_release.sh

      - name: Set up Docker Buildx
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote Release Container Images
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        env:
          RELEASE_VERSION: ${{ steps.calculate-version.outputs.release_version }}
        run: ./scripts/release/promote_release_images.sh

      - name: Install Cosign
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Promoted Container Images
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        env:
          RELEASE_VERSION: ${{ steps.calculate-version.outputs.release_version }}
        run: ./scripts/release/sign_release_images.sh

      - name: Set up Helm
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Package, Publish and Sign Helm Chart
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        env:
          RELEASE_VERSION: ${{ steps.calculate-version.outputs.release_version }}
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: ./scripts/release/publish_helm_chart.sh

      - name: Publish GitHub Release
        if: steps.verify-eligibility.outputs.skip_release != 'true'
        env:
          RELEASE_VERSION: ${{ steps.calculate-version.outputs.release_version }}
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: ./scripts/release/publish_github_release.sh
