# ==============================================================================
# Declarative E2E Test Suite Matrix & Cluster Configuration
# ==============================================================================
# Defines the test matrix: GCP environments, clusters, Terraform modules,
# and test suites to execute.
# ==============================================================================

version: "1.0"

defaults:
  region: "us-east4"
  namespace: "kubeagents-system"
  timeout_seconds: 600
  default_environment: "cluster-e2e"

environments:
  # ----------------------------------------------------------------------------
  # 1. Google Chat Agent E2E Environment
  # ----------------------------------------------------------------------------
  - name: "gchat-e2e"
    description: "Google Chat ingress and messaging E2E test suite"
    region: "us-east4"
    namespace: "kubeagents-system"
    env_vars:
      CHAT_TOPIC_NAME: "platform-agent-chat-events"
    tests:
      - "tests/e2e/gchat_agent_test.py"

  # ----------------------------------------------------------------------------
  # 2. General Cluster / SRE / Stockout E2E Environment
  # ----------------------------------------------------------------------------
  - name: "cluster-e2e"
    description: "Core harness tests: Agent API health, Google Chat, Fleet SRE Audit, Stockout Investigation, and Operator Plugins"
    region: "us-east4"
    namespace: "kubeagents-system"
    env_vars:
      CHAT_TOPIC_NAME: "platform-agent-chat-events"
      GITHUB_ORG: "test-org-kube-agent"
      GITHUB_REPO: "test-org-kube-agent/agents-repo"
      STOCKOUT_SCENARIOS: "04"
      FLEET_AUDIT_STREAMS: "stockout-prevention"
    tests:
      - "tests/e2e/test_agent_api_health.py"
      - "tests/e2e/gchat_agent_test.py"
      - "tests/e2e/test_agent_fleet_audit.py"
      - "tests/e2e/test_stockout_investigation.py"
      - "tests/e2e/operator/agentplugins_e2e_test.py"

  # ----------------------------------------------------------------------------
  # 3. Fleet SRE Audit E2E Environment
  # ----------------------------------------------------------------------------
  - name: "audit-e2e"
    description: "Fleet SRE Audit, Token minting and Dry-run ledger suites"
    region: "us-east4"
    namespace: "kubeagents-system"
    env_vars:
      GITHUB_ORG: "test-org-kube-agent"
      GITHUB_REPO: "test-org-kube-agent/agents-repo"
      FLEET_AUDIT_STREAMS: "all"
    tests:
      - "tests/e2e/test_agent_api_health.py"
      - "tests/e2e/test_agent_fleet_audit.py"

  # ----------------------------------------------------------------------------
  # 4. Operator Plugin Reconciliation E2E Environment
  # ----------------------------------------------------------------------------
  - name: "operator-e2e"
    description: "Operator plugin reconciliation and lifecycle test suite"
    region: "us-east4"
    namespace: "kubeagents-system"
    tests:
      - "tests/e2e/operator/agentplugins_e2e_test.py"
