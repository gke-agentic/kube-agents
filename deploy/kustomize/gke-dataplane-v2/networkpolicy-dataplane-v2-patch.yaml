apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-agent-gateway-netpol
  namespace: kubeagents-system
spec:
  egress:
    # 1. Cluster DNS (Scoped specifically to CoreDNS and NodeLocal DNSCache pods in kube-system)
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: node-local-dns
        - ipBlock:
            cidr: 169.254.20.10/32
    # 2a. GCP Workload Identity / Metadata Server (Link-Local & Daemon pod)
    - ports:
        - port: 80
          protocol: TCP
      to:
        - ipBlock:
            cidr: 169.254.169.254/32
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: gke-metadata-server
    # 2b. GKE Workload Identity Host Network Daemon (Port 988 only)
    - ports:
        - port: 988
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: gke-metadata-server
    # 3. LiteLLM Gateway in kubeagents-system
    - ports:
        - port: 4000
          protocol: TCP
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubeagents-system
          podSelector:
            matchLabels:
              app: litellm
    # 4. Kubernetes API Server (Internal Control Plane)
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
        - ipBlock:
            cidr: 34.118.0.0/16
    # 5. GKE Managed OpenTelemetry Collector (Trace Export)
    - ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gke-managed-otel
