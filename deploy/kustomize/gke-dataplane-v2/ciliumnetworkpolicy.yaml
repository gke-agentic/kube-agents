apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: platform-agent-gateway-apiserver
  namespace: kubeagents-system
  labels:
    app: platform-agent-gateway
spec:
  endpointSelector:
    matchLabels:
      app: platform-agent-gateway
  egress:
    - toEntities:
        - kube-apiserver
