apiVersion: networking.gke.io/v1alpha1
kind: FQDNNetworkPolicy
metadata:
  name: platform-agent-fqdn-netpol
  namespace: kubeagents-system
  labels:
    app: platform-agent
spec:
  podSelector:
    matchLabels:
      app: platform-agent
  egress:
    - matches:
        - pattern: "googleapis.com"
        - pattern: "*.googleapis.com"
        - pattern: "accounts.google.com"
        - pattern: "*.gstatic.com"
        - pattern: "gcr.io"
        - pattern: "*.gcr.io"
        - pattern: "pkg.dev"
        - pattern: "*.pkg.dev"
        - pattern: "github.com"
        - pattern: "*.github.com"
        - pattern: "*.githubusercontent.com"
        - pattern: "slack.com"
        - pattern: "*.slack.com"
        - pattern: "*.slack-edge.com"
        - pattern: "*.slack-msgs.com"
        - pattern: "api.openai.com"
        - pattern: "api.anthropic.com"
        - pattern: "api.groq.com"
        - pattern: "api.mistral.ai"
        - pattern: "api.cohere.ai"
        - pattern: "*.openai.azure.com"
        - pattern: "*.litellm.ai"
        - pattern: "generativelanguage.googleapis.com"
        - pattern: "pypi.org"
        - pattern: "*.pypi.org"
        - pattern: "pythonhosted.org"
        - pattern: "*.pythonhosted.org"
        - pattern: "files.pythonhosted.org"
        - pattern: "registry.npmjs.org"
        - pattern: "*.npmjs.org"
        - pattern: "huggingface.co"
        - pattern: "*.huggingface.co"
        - pattern: "hf.co"
        - pattern: "*.hf.co"
      ports:
        - protocol: "TCP"
          port: 443
