steps:
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - "docker pull $_IMAGE_URI_LATEST || true"
  - name: "gcr.io/cloud-builders/docker"
    env:
      - "DOCKER_BUILDKIT=1"
    args:
      - "build"
      # Deployment targets are always amd64 GKE nodes; the multi-arch bases
      # otherwise resolve to the build host (#560).
      - "--platform"
      - "linux/amd64"
      - "-t"
      - "$_IMAGE_URI"
      - "-t"
      - "$_IMAGE_URI_LATEST"
      - "--cache-from"
      - "$_IMAGE_URI_LATEST"
      - "-f"
      - "deploy/docker/Dockerfile"
      - "--target"
      - "$_TARGET"
      - "--build-arg"
      - "BUILDKIT_INLINE_CACHE=1"
      - "--build-arg"
      - "HERMES_AGENT_TAG=$_HERMES_AGENT_TAG"
      # The revision stamp. deploy/docker/Dockerfile writes these into
      # /opt/build-info.json, which is how a running pod can say which commit it
      # is. Empty is a legal value and means "unknown" -- the self-improvement
      # runner refuses to investigate an unstamped image rather than guess at
      # `main`, so a build that omits these produces an image the loop declines
      # to work on. Both ARGs sit at the very end of the Dockerfile, so a
      # changing SHA invalidates one ~100-byte layer and nothing above it.
      - "--build-arg"
      - "GIT_SHA=$_GIT_SHA"
      - "--build-arg"
      - "IMAGE_TAG=$_IMAGE_TAG"
      - "."
images:
  - "$_IMAGE_URI"
  - "$_IMAGE_URI_LATEST"
substitutions:
  _IMAGE_URI: ""
  _IMAGE_URI_LATEST: ""
  _TARGET: ""
  _HERMES_AGENT_TAG: ""
  _GIT_SHA: ""
  _IMAGE_TAG: ""
