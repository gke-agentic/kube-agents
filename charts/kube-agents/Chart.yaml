apiVersion: v2
name: kube-agents
description: Canonical Helm chart for deploying Kube-Agents Kubernetes Operator and Platform Agent profiles on GKE.
type: application
# version and appVersion are placeholders: release-publish.yml (via publish_helm_chart.sh)
# overwrites both with the SemVer release tag at publish time, so the chart version tracks the app version.
version: 0.1.0
appVersion: "v0.1.0"
# The floor for the chart as a whole. selfImprovement carries a higher one --
# its credential proxy is a native sidecar, GA in 1.29 -- and templates/self-improvement.yaml
# checks for it when the feature is enabled, so a 1.28 cluster can still run the
# operator and the agent.
kubeVersion: ">=1.28.0-0"
