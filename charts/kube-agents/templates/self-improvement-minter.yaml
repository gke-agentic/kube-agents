{{- /*
The self-improvement loop's OWN GitHub token minter.

A second minty deployment, not a second rule on the existing one. The design
argues that at length (docs/designs/self-improvement.md sec. 6); the short
version is that minty scopes a token by the App it signs as, so putting a rule
for kube-agents on the minter that serves the user's GitOps repositories means
one App installed on both, and one revocation, and one blast radius. Two
deployments cost a Service and a ConfigMap and buy an identity that cannot reach
the user's infrastructure even if this loop is compromised outright.

The integration seam is one environment variable. The runner's credential proxy
gets TOKEN_BROKER_URL pointed here instead of at github-token-minter, and
nothing in credential_proxy.py, github_token_refresh.py or the operator changes
at all. That is the whole answer to the isolation requirement.

Rendered only for the fork and upstream modes. The GCP half -- the GSA, its
Workload Identity binding, and the import-only KMS key holding the App's private
key -- is terraform/modules/kube-agents-selfimprove.
*/}}
{{- if and .Values.selfImprovement.enabled (ne (.Values.selfImprovement.mode | default "report-only") "report-only") }}
{{- $si := .Values.selfImprovement }}
{{- $g := $si.github }}
{{- $ns := .Release.Namespace }}
{{- $name := "kube-agents-selfimprove" }}
{{- $projectId := required "platformAgent.harness.projectId is required when selfImprovement.mode is fork or upstream" .Values.platformAgent.harness.projectId }}
{{- $location := required "platformAgent.harness.location is required when selfImprovement.mode is fork or upstream" .Values.platformAgent.harness.location }}
{{- $clusterName := required "platformAgent.harness.clusterName is required when selfImprovement.mode is fork or upstream" .Values.platformAgent.harness.clusterName }}
{{- $kmsLocation := $g.kms.location | default (regexReplaceAll "-[a-z]$" $location "") }}
{{- $gsa := $g.gsaName | default "kubeagents-selfimprove" }}
{{- $minterGsa := printf "%s-minter" $gsa }}
{{- /*
A GCP service account id is 6-30 characters. The minter's is derived by
appending `-minter` to the investigator's, so a gsaName over 23 characters
produces an account that cannot exist -- and nothing here would notice: the
chart renders, the pod schedules, and the failure surfaces as an unauthenticated
KMS call much later. Fail at render instead.
*/ -}}
{{- if gt (len $minterGsa) 30 }}
{{- fail (printf "selfImprovement.github.gsaName %q makes the derived minter account %q %d characters; a GCP service account id is capped at 30, so use a gsaName of 23 characters or fewer" $gsa $minterGsa (len $minterGsa)) }}
{{- end }}
{{- $allowedSa := printf "%s@%s.iam.gserviceaccount.com" $gsa $projectId }}
{{- /*
One minty config file per repository the loop touches, keyed by "<org>/<repo>"
so a fork in the same org as upstream renders one file rather than two
conflicting ones -- and each carries only the permissions that repository's role
in the flow needs.

In upstream mode the two roles are not the same grant. The fork receives a
pushed branch, so it needs `contents: write`. The upstream receives a cross-fork
pull request opened from that branch, which needs `pull_requests: write` and
nothing else: opening a PR from a head that already exists on the fork does not
write to the base repository. Granting `contents: write` there too -- the
obvious shortcut of one permission set for both -- would hand an autonomous loop
the ability to push directly to gke-labs/kube-agents, which is the one thing
repository policy says never to do, and it would be available to every run
rather than to a mistake.

Fork mode has one repository playing both roles, so there the fork carries both
permissions.

One slug for both would collapse the two rules into the wider one, which is
exactly the push grant on the upstream that the paragraph above rules out. It
cannot arrive here: self-improvement.yaml fails the render on it, so this file
never has to decide which grant wins.
*/ -}}
{{- $repos := dict }}
{{- if eq $si.mode "upstream" }}
{{- /*
The fork is a branch host and nothing else here: the pull request is opened
against the upstream, and `gh pr create` writes to the base repository, not to
the head one. So `pull_requests: write` on the fork is a permission with no
call site -- and the loop's whole argument for being safe to run unattended is
that each grant is the smallest one its step needs.
*/ -}}
{{- $_ := set $repos $g.forkRepo (dict "contents" "write") }}
{{- $_ := set $repos ($g.upstreamRepo | default "gke-labs/kube-agents") (dict "pull_requests" "write") }}
{{- else }}
{{- /* Fork mode: one repository, which both receives the branch and hosts the pull request. */ -}}
{{- $_ := set $repos $g.forkRepo (dict "contents" "write" "pull_requests" "write") }}
{{- end }}
---
# The App identity this minter signs as. A DIFFERENT App from
# githubMinter's: same reasoning as the separate deployment, and the two
# Secrets are separate objects so revoking one leaves the other working.
#
# Unconditional. This used to be wrapped in `if $g.appId`, which turned a
# missing value into a Deployment that secretKeyRefs an object nobody rendered;
# self-improvement.yaml now fails the render instead, so by the time this is
# reached the value is set.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-app-credentials
  namespace: {{ $ns }}
  labels:
    {{- include "kube-agents.labels" . | nindent 4 }}
    app.kubernetes.io/name: kube-agents-selfimprove-token-minter
type: Opaque
stringData:
  app-id: {{ $g.appId | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-token-minter
  namespace: {{ $ns }}
  labels:
    {{- include "kube-agents.labels" . | nindent 4 }}
    app.kubernetes.io/name: kube-agents-selfimprove-token-minter
  annotations:
    iam.gke.io/gcp-service-account: {{ printf "%s@%s.iam.gserviceaccount.com" $minterGsa $projectId }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-token-minter-config
  namespace: {{ $ns }}
  labels:
    {{- include "kube-agents.labels" . | nindent 4 }}
    app.kubernetes.io/name: kube-agents-selfimprove-token-minter
data:
{{- range $slug, $perms := $repos }}
{{- $parts := splitList "/" $slug }}
{{- if ne (len $parts) 2 }}
{{- fail (printf "selfImprovement.github repositories must be owner/repo; got %q" $slug) }}
{{- end }}
{{- $org := index $parts 0 }}
{{- $repo := index $parts 1 }}
  {{ $org }}-{{ $repo }}.yaml: |
    version: 'minty.abcxyz.dev/v2'
    rule:
      if: "assertion.iss == 'https://accounts.google.com'"
    scope:
      # `platform-agent-scope`, on the loop's own minter, for a scope that has
      # nothing to do with the Platform Agent. The name is not a choice made
      # here: github_token_refresh.py hardcodes it in the request body, so a
      # minter that names its scope anything else refuses every token. Renaming
      # it means changing that client, which means touching the agent's
      # credential path -- exactly what this feature is arranged not to do.
      # Worth fixing separately; not worth spending the isolation budget on.
      platform-agent-scope:
        rule:
          if: "assertion.email in ['{{ $allowedSa }}']"
        repositories:
          - '{{ $repo }}'
        # No `issues`, unlike githubMinter's grant. The loop's output is a pull
        # request; it has no reason to open, close or comment on issues, and a
        # permission granted "just in case" to an autonomous agent is a
        # permission it will eventually use.
        #
        # `contents` appears here only for the fork -- see the comment on
        # $repos. Iteration over a Helm dict is key-sorted, so `contents`
        # precedes `pull_requests` and the rendered order is stable.
        permissions:
          {{- range $permission, $level := $perms }}
          {{ $permission }}: {{ $level | quote }}
          {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-token-minter
  namespace: {{ $ns }}
  labels:
    app: {{ $name }}-token-minter
    {{- include "kube-agents.labels" . | nindent 4 }}
    app.kubernetes.io/name: kube-agents-selfimprove-token-minter
spec:
  # One replica, unlike githubMinter's two. This minter serves one caller, once
  # an hour, and that caller already tolerates the run failing -- so the
  # availability that justifies a second replica on the agent's path buys
  # nothing here and costs a pod.
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}-token-minter
  template:
    metadata:
      labels:
        app: {{ $name }}-token-minter
        {{- include "kube-agents.labels" . | nindent 8 }}
        app.kubernetes.io/name: kube-agents-selfimprove-token-minter
    spec:
      serviceAccountName: {{ $name }}-token-minter
      {{- with (include "kube-agents.imagePullSecrets" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: token-minter
          image: {{ include "kube-agents.thirdPartyImage" (dict "repository" $g.image.repository "tag" $g.image.tag "root" .) }}
          imagePullPolicy: {{ $g.image.pullPolicy }}
          command: ["/minty"]
          args: ["server", "run"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: CONFIGS_DIR
              value: "/etc/minty"
            - name: ISSUER_ALLOWLIST
              value: "https://container.googleapis.com/v1/projects/{{ $projectId }}/locations/{{ $location }}/clusters/{{ $clusterName }},https://accounts.google.com"
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-app-credentials
                  key: app-id
            # Its own keyring and key, so rotating or destroying the loop's App
            # key cannot touch the one the agent's GitOps writes depend on. The
            # version must be ENABLED, which means the App private key has been
            # imported; until then this pod fails readiness and the loop simply
            # does not file, which is the correct failure.
            - name: KMS_KEY_NAME
              value: "projects/{{ $projectId }}/locations/{{ $kmsLocation }}/keyRings/{{ $g.kms.keyring }}/cryptoKeys/{{ $g.kms.key }}/cryptoKeyVersions/{{ $g.kms.keyVersion }}"
            - name: SOURCE_SYSTEM_AUTH
              value: "gha://$(GITHUB_APP_ID)?kms_id=$(KMS_KEY_NAME)"
          livenessProbe:
            httpGet:
              path: /version
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /version
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
{{- range $slug, $_ignored := $repos }}
{{- $parts := splitList "/" $slug }}
{{- $org := index $parts 0 }}
{{- $repo := index $parts 1 }}
            - name: config-volume
              mountPath: /etc/minty/{{ $org }}/{{ $repo }}.yaml
              subPath: {{ $org }}-{{ $repo }}.yaml
{{- end }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ $name }}-token-minter-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-token-minter
  namespace: {{ $ns }}
  labels:
    {{- include "kube-agents.labels" . | nindent 4 }}
    app.kubernetes.io/name: kube-agents-selfimprove-token-minter
spec:
  selector:
    app: {{ $name }}-token-minter
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
{{- if $si.networkPolicy }}
---
# The mirror image of github-token-minter-policy, and the asymmetry is the
# point. That one admits pods labelled `has-credential-proxy: "true"`; this one
# admits only `selfimprove: "true"`. The runner pod carries the second label and
# not the first, so neither minter will answer the other's caller -- which is
# what makes "the loop cannot reach the user's GitOps repositories" a property
# of the cluster rather than a promise in a document.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-token-minter-policy
  namespace: {{ $ns }}
  labels:
    {{- include "kube-agents.labels" . | nindent 4 }}
    app.kubernetes.io/name: kube-agents-selfimprove-token-minter
spec:
  podSelector:
    matchLabels:
      app: {{ $name }}-token-minter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              kubeagents.x-k8s.io/selfimprove: "true"
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS. Both selector shapes plus the two ClusterIP forms, copied from
    # github-token-minter-policy -- see the long note there for why the
    # podSelector alone never matches the kube-dns VIP.
    #
    # One deliberate departure from that copy: it ends with `0.0.0.0/0` less the
    # private ranges, which on port 53 is a standing channel to any resolver on
    # the internet, and this pod holds a GitHub App private key. That peer is
    # there because the modern GKE DNS VIP (34.118.224.10) is in public address
    # space and no private-range CIDR reaches it. Naming the VIP does reach it,
    # so the wide peer is not needed here. Shares selfImprovement.dnsCIDRs with
    # the runner's policy, which has the full note.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: node-local-dns
        - ipBlock:
            cidr: 169.254.20.10/32
        - ipBlock:
            cidr: 169.254.169.254/32
        {{- range $si.dnsCIDRs | default (list "34.118.224.10/32" "10.96.0.10/32") }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Workload Identity via the metadata server. The port-988 rule covers the
    # node's DNAT of 169.254.169.254:80; on Dataplane V2 add one /32 per node.
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 988
    # GitHub and Cloud KMS.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
{{- end }}
{{- end }}
